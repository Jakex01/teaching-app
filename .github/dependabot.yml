# Weekly pull requests that keep dependencies up to date (and patch known vulnerabilities).
# cooldown: new releases are proposed only after 7 days, so a hijacked package version that gets
# pulled within days never reaches us. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker
    directories: [/apps/web, /apps/sync]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
